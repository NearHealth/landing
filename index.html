<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme-aware favicon. The adaptive favicon.svg carries an internal
         @media (prefers-color-scheme: dark) rule — Chrome/Edge/Firefox use it and
         switch glyph colour with the OS theme. The PNG is a static fallback for
         browsers without SVG-favicon support (Safari); its explicit sizes="32x32"
         is REQUIRED so Chrome prefers the scalable SVG over the raster. Do NOT add
         media-query PNG links: Chrome ignores `media` on <link rel=icon>, treats
         them as unconditional candidates, and may pick one — which is what stopped
         the icon adapting. Bump ?v=N whenever an icon changes (busts the ~30-day
         favicon cache). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-light.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=4" />
    <title>Near Health — Turning coverage into care</title>
    <meta name="description" content="Near coordinates care after enrollment without adding operational burden. Built for brokers and providers.">

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Near Health — Turning coverage into care" />
    <meta property="og:description" content="Near coordinates care after enrollment without adding operational burden. Built for brokers and providers." />
    <meta property="og:url" content="https://nearhealth.github.io/landing/" />
    <meta property="og:image" content="https://nearhealth.github.io/landing/assets/images/og-image-20260609.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Near Health — Turning coverage into care" />
    <meta name="twitter:description" content="Near coordinates care after enrollment without adding operational burden." />
    <meta name="twitter:image" content="https://nearhealth.github.io/landing/assets/images/og-image-20260609.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://nearhealth.github.io/landing/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Near Health",
      "url": "https://near.health",
      "description": "Near coordinates care after enrollment without adding operational burden."
    }
    </script>
    <link rel="preload" href="/landing/assets/fonts/Gilroy-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/landing/assets/fonts/Gilroy-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/fonts.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
