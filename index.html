<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme-aware favicon. Chrome + Firefox switch via the prefers-color-scheme
         media query embedded inside the SVG (the `media` attr on rel=icon does NOT
         work in Chrome). PNG is the fallback for browsers without SVG-favicon
         support (Safari) — Firefox still respects its media attribute there. -->
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <title>Near Health — Turning coverage into care</title>
    <meta name="description" content="Near coordinates care after enrollment without adding operational burden. Built for brokers and providers.">

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Near Health — Turning coverage into care" />
    <meta property="og:description" content="Near coordinates care after enrollment without adding operational burden. Built for brokers and providers." />
    <meta property="og:url" content="https://nearhealth.github.io/landing/" />
    <meta property="og:image" content="https://nearhealth.github.io/landing/assets/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Near Health — Turning coverage into care" />
    <meta name="twitter:description" content="Near coordinates care after enrollment without adding operational burden." />
    <meta name="twitter:image" content="https://nearhealth.github.io/landing/assets/images/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://nearhealth.github.io/landing/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Near Health",
      "url": "https://near.health",
      "description": "Near coordinates care after enrollment without adding operational burden."
    }
    </script>
    <link rel="preload" href="/landing/assets/fonts/Gilroy-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/landing/assets/fonts/Gilroy-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/fonts.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
