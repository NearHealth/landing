<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme-aware favicon. The adaptive favicon.svg carries an internal
         @media (prefers-color-scheme: dark) rule — Chrome/Edge/Firefox use it and
         switch glyph colour with the OS theme. The PNG is a static fallback for
         browsers without SVG-favicon support (Safari); its explicit sizes="32x32"
         is REQUIRED so Chrome prefers the scalable SVG over the raster. Do NOT add
         media-query PNG links: Chrome ignores `media` on <link rel=icon>, treats
         them as unconditional candidates, and may pick one — which is what stopped
         the icon adapting. Bump ?v=N whenever an icon changes (busts the ~30-day
         favicon cache). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-light.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=4" />
    <title>Near Health — The future of post-enrollment healthcare</title>
    <meta name="description" content="The first AI-native infrastructure bridging coverage and care. Built for brokers and providers.">

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Near Health — The future of post-enrollment healthcare" />
    <meta property="og:description" content="The first AI-native infrastructure bridging coverage and care. Built for brokers and providers." />
    <meta property="og:url" content="https://nearhealth.github.io/landing/" />
    <meta property="og:image" content="https://nearhealth.github.io/landing/assets/images/og-image-20260609.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Near Health — The future of post-enrollment healthcare" />
    <meta name="twitter:description" content="The first AI-native infrastructure bridging coverage and care." />
    <meta name="twitter:image" content="https://nearhealth.github.io/landing/assets/images/og-image-20260609.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://nearhealth.github.io/landing/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Near Health",
      "url": "https://near.health",
      "description": "The first AI-native infrastructure bridging coverage and care."
    }
    </script>
    <link rel="preload" href="/landing/assets/fonts/Gilroy-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/landing/assets/fonts/Gilroy-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Video cover frames. Fetched per-viewport before React boots so the
         video cards never sit as empty white boxes while JS loads on a slow
         connection — the poster is in cache by the time the <video> renders.
         Media queries mirror the <source media> boundary in ResponsiveVideo/
         ScrollPlayVideo (≤480 phone, ≥481 tablet+desktop). Hero posters are
         above the fold → high priority; the member-experience pair rides along
         at default priority. -->
    <link rel="preload" as="image" href="/landing/assets/video/hero_mobile_poster.jpg" media="(max-width: 480px)" fetchpriority="high">
    <link rel="preload" as="image" href="/landing/assets/video/hero_desktop_poster.jpg" media="(min-width: 481px)" fetchpriority="high">
    <link rel="preload" as="image" href="/landing/assets/video/ai_chat_mobile_poster.jpg" media="(max-width: 480px)">
    <link rel="preload" as="image" href="/landing/assets/video/ai_chat_desktop_poster.jpg" media="(min-width: 481px)">
    <!-- Background mesh — preload so it's decoded before React renders .site-bg
         (avoids the navbar blend flickering against an undecoded background).
         Base-less path: Vite prepends the /landing/ base once (as with favicon). -->
    <link rel="preload" as="image" href="/assets/images/site-bg.jpg" fetchpriority="high">
    <link href="/fonts.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
